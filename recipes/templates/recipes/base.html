<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Генератор рецептов{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0; background: #f6f4ef; color: #2b2b2b; line-height: 1.5;
    }
    nav {
      background: #3d5a40; padding: 0 1.5rem;
      display: flex; gap: 1.5rem; align-items: center;
    }
    nav .brand { color: #fff; font-weight: 700; padding: 0.9rem 0; margin-right: auto; }
    nav a { color: #e6efe6; text-decoration: none; padding: 0.9rem 0; }
    nav a:hover { color: #fff; text-decoration: underline; }
    nav a.exit { color: #ffd2c9; }
    main { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
    section {
      background: #fff; border-radius: 8px; padding: 1.2rem 1.5rem;
      margin-bottom: 1.5rem; box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
    }
    h2 { margin-top: 0; font-size: 1.2rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #e4e0d6; }
    th { background: #efece3; }
    label { display: block; font-weight: 600; margin: 0.6rem 0 0.2rem; }
    input, select, textarea {
      width: 100%; padding: 0.45rem; border: 1px solid #bbb;
      border-radius: 4px; font: inherit;
    }
    button {
      margin-top: 0.8rem; padding: 0.5rem 1.1rem; border: 0; border-radius: 4px;
      background: #3d5a40; color: #fff; font: inherit; cursor: pointer;
    }
    button:hover { background: #2f4731; }
    button.danger { margin: 0; padding: 0.25rem 0.7rem; background: #b3402a; }
    button.danger:hover { background: #8f3220; }
    .messages { list-style: none; padding: 0; margin: 0 0 1.5rem; }
    .messages li { padding: 0.7rem 1rem; border-radius: 6px; margin-bottom: 0.5rem; }
    .messages .success { background: #dff0d8; color: #2d5a1e; }
    .messages .error { background: #f8d7d2; color: #8a2a1a; }
    .muted { color: #777; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">🍳 Генератор рецептов</span>
    <a href="{% url 'dashboard' %}">Главная</a>
    <a href="{% url 'dashboard' %}#add-section">Добавить рецепт</a>
    <a href="{% url 'dashboard' %}#log-section">Журнал</a>
    <a href="{% url 'exit' %}" class="exit">Выход</a>
  </nav>

  <main>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
